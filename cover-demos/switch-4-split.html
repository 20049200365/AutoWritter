<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>切换 demo 4 · 双栏自适应（拖宽出列表）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f6f1e6;--card:#fbf8f0;--sub:#f0e8d6;--deep:#e9dfc8;--ink:#2f2a22;--ink2:#5c5548;--ink3:#8d8574;--line:#e3d9c4;--line2:#d3c7aa;--seal:#a8433a;--seal-soft:rgba(168,67,58,.09)}
body{background:#ece7da;font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif;font-size:14px;color:var(--ink);display:flex;gap:40px;padding:40px;align-items:flex-start}
.hint{font-size:13px;color:var(--ink3);line-height:2;font-family:"Kaiti SC","STKaiti","KaiTi",serif}
.hint b{color:var(--seal)}
.wrap{position:relative;width:400px;height:640px;flex:none}
#chat{width:100%;height:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 4px rgba(47,42,34,.06),0 10px 30px rgba(47,42,34,.08)}
#hd{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
#hd .t{font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--ink2);font-family:var(--kai)}
#hd .grow{flex:1}
#hd .w-tip{font-size:10.5px;color:var(--ink3);font-family:monospace}
/* ===== 核心：内部双栏（列表 + 聊天） ===== */
#body{flex:1;display:flex;min-height:0}
/* 会话列表列：默认隐藏，宽度足够时出现 */
#sesscol{width:0;overflow:hidden;flex:none;display:flex;flex-direction:column;background:var(--paper);border-right:1px solid var(--line);transition:width .18s ease}
.wrap.wide #sesscol{width:170px}
#sc-hd{flex:none;padding:8px 10px 6px;font-size:11px;color:var(--ink3);letter-spacing:.15em;white-space:nowrap}
#sc-list{flex:1;overflow-y:auto;padding:2px 6px 6px;display:flex;flex-direction:column;gap:2px}
.s-item{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--ink2);white-space:nowrap}
.s-item:hover{background:var(--deep)}
.s-item.on{background:var(--seal-soft);color:var(--ink);font-weight:600}
.s-item .s-t{overflow:hidden;text-overflow:ellipsis;min-width:0}
.s-item .s-x{flex:none;width:15px;height:15px;border-radius:4px;display:none;align-items:center;justify-content:center;font-size:10px;color:var(--ink3)}
.s-item:hover .s-x{display:inline-flex}
.s-item .s-x:hover{background:var(--line2);color:var(--ink)}
#sc-new{flex:none;display:flex;align-items:center;gap:5px;padding:6px 8px;margin:0 6px 6px;border:1px dashed var(--line2);border-radius:7px;font-size:11.5px;color:var(--ink3);cursor:pointer;font-family:var(--kai);white-space:nowrap}
#sc-new:hover{background:var(--sub);color:var(--ink)}
/* 聊天列 */
#chatcol{flex:1;min-width:0;display:flex;flex-direction:column}
#chatcol .curbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--ink2)}
#chatcol .curbar b{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#chatcol .curbar button{flex:none;width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink3);cursor:pointer;background:none;border:none}
#chatcol .curbar button:hover{background:var(--deep);color:var(--ink)}
#scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg.user{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--kai);font-size:13px}
.msg.user .av{background:var(--deep);color:var(--ink2)}
.msg.ai .av{background:var(--seal);color:var(--card)}
.bb{max-width:82%;padding:9px 12px;border-radius:11px;font-size:12.5px;line-height:1.8}
.msg.user .bb{background:var(--sub);border:1px solid var(--line);border-top-right-radius:4px}
.msg.ai .bb{background:var(--card);border:1px solid var(--line);border-top-left-radius:4px;flex:1;min-width:0}
#input{flex:none;display:flex;gap:7px;align-items:flex-end;padding:10px 16px 14px;border-top:1px solid var(--line)}
#input textarea{flex:1;border:1px solid var(--line2);border-radius:11px;background:var(--paper);padding:8px 10px;font-size:12.5px;resize:none;outline:none;font-family:inherit;line-height:1.6}
#input button{padding:6px 14px;border-radius:8px;background:var(--ink);color:var(--paper);font-size:12.5px;border:none;cursor:pointer;flex:none}
/* 拖拽条 */
#resizer{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:30}
#resizer:hover{background:rgba(168,67,58,.25);border-radius:4px}
#wbar{position:absolute;left:0;right:-18px;bottom:-26px;text-align:center;font-size:11px;color:var(--ink3);font-family:monospace}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div id="chat">
    <div id="hd"><span class="t">Agent 对话</span><span class="grow"></span><span class="w-tip" id="wTip">400px</span></div>
    <div id="body">
      <!-- 会话列表列（拖宽自动出现） -->
      <div id="sesscol">
        <div id="sc-hd">会 话</div>
        <div id="sc-list"></div>
        <div id="sc-new">＋ 新建会话</div>
      </div>
      <!-- 聊天列 -->
      <div id="chatcol">
        <div class="curbar"><b id="curT">AI 提议 · 家底盘点</b><button id="mobileMenu" title="会话列表">☰</button></div>
        <div id="scroll"></div>
        <div id="input"><textarea rows="1" placeholder="问点什么…"></textarea><button>落笔</button></div>
      </div>
    </div>
  </div>
  <div id="resizer" title="拖拽宽度"></div>
  <div id="wbar">← 拖拽本栏右缘：宽了出列表，窄了收干净 →</div>
</div>
<div class="hint">
  <b>方案 4 · 双栏自适应</b><br>
  对话栏可拖宽（就是你上轮加的功能）。<br>
  宽度 ≥ 520px：左侧自动浮出会话列表，<br>
  列表 + 聊天同时可见。<br>
  宽度 < 520px：列表收起，点 ☰ 弹出。<br><br>
  优点：宽屏时扫视管理，窄屏时干净，<br>
  两种形态一套交互。<br>
  缺点：实现稍复杂。<br><br>
  主流代表：桌面端 IDE / 响应式 IM。
</div>
<script>
const S0 = [
  { t: 'AI 提议 · 家底盘点', msgs: [['u','你好，盘点一下这本书的家底'],['a','这本书目前 1 章 / 2035 字，人物和伏笔都还是 0。需要我帮你规划下一步吗？']] },
  { t: '伏笔梳理：千骨铁条', msgs: [['u','把千骨铁条的伏笔理一遍'],['a','「千骨」铁条已埋下：锈壳上的暗红字迹、伤口渗血吸收、灵气自掌心旧疤运转。悬空 0 个，回收 0 个。']] },
  { t: '节奏诊断：第一章', msgs: [['u','诊断一下大纲节奏'],['a','第一章以「灵田劳作—被欺—铁条认主」推进，起势平稳，结尾以门外脚步声收束，钩子成立。整体节奏偏慢，建议第二章加快冲突。']] },
  { t: '人物动机分析', msgs: [['u','分析主要人物的动机'],['a','陈默：废灵根却不甘，铁条是他唯一的「变数」。陈九：家族资源玩家，欺压是维持地位的本能。目前人物弧光主要压在陈默身上。']] },
  { t: '卡文疏导', msgs: [['u','我有点卡文了'],['a','卡在哪了？如果是过渡段，可以先用一句话推进剧情，细节回头补。如果是情节走向，把「下一步必然发生的事」列出来，选最难受的那条写。']] },
]
let idx = 0
const wrap = document.getElementById('wrap')
const scList = document.getElementById('sc-list')
const scroll = document.getElementById('scroll')
const curT = document.getElementById('curT')
const wTip = document.getElementById('wTip')
function applyW(){
  const w = wrap.offsetWidth
  wTip.textContent = w + 'px'
  wrap.classList.toggle('wide', w >= 520)
  if (w >= 520) mobileMenu.style.display = 'none'
  else mobileMenu.style.display = 'inline-flex'
}
function renderList(){
  scList.innerHTML = ''
  S0.forEach((s,i)=>{
    const d = document.createElement('div')
    d.className = 's-item' + (i===idx?' on':'')
    d.innerHTML = `<span class="s-t">${s.t}</span><span class="s-x">✕</span>`
    d.onclick = (e)=>{ if(e.target.classList.contains('s-x')) return; idx=i; renderList(); renderMsgs() }
    d.querySelector('.s-x').onclick = (e)=>{ e.stopPropagation(); S0.splice(i,1); if(idx>=S0.length) idx=Math.max(0,S0.length-1); renderList(); renderMsgs() }
    scList.appendChild(d)
  })
}
function renderMsgs(){
  const s = S0[idx]
  curT.textContent = s ? s.t : ''
  const msgs = s ? (s.msgs || [['a','这是「'+s.t+'」会话。']]) : [['a','没有会话了。点 ＋ 新建一个。']]
  scroll.innerHTML = msgs.map(([r,t])=>`<div class="msg ${r}"><span class="av">${r==='u'?'我':'墨'}</span><div class="bb">${t}</div></div>`).join('')
}
document.getElementById('sc-new').onclick = ()=>{ S0.push({t:'新会话',msgs:[['a','新会话已就绪。问我续写、伏笔、节奏、人物。']]}); idx=S0.length-1; renderList(); renderMsgs() }
/* 拖宽逻辑 */
const rz = document.getElementById('resizer')
const mobileMenu = document.getElementById('mobileMenu')
rz.addEventListener('mousedown', (e)=>{
  e.preventDefault()
  const startX = e.clientX, startW = wrap.offsetWidth
  const mv = (ev)=>{ wrap.style.width = Math.min(680, Math.max(340, startW + ev.clientX - startX)) + 'px'; applyW() }
  const up = ()=>{ document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up) }
  document.addEventListener('mousemove', mv)
  document.addEventListener('mouseup', up)
})
mobileMenu.onclick = ()=>{ location.href = 'switch-3-drawer.html' }
renderList(); renderMsgs(); applyW()
</script>
</body>
</html>
